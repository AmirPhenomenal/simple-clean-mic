[package]
name = "simple-clean-mic"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4"
nnnoiseless = "0.5"
sonora = "0.2.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
